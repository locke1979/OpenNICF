[project]
name = "opennicf"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
qwen = ["qwen-agent>=0.0.25"]
knowledge = ["psycopg[binary]>=3.2"]
code-intel = ["tree-sitter>=0.24", "tree-sitter-language-pack>=0.8"]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
